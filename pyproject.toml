[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-insurance-ai"
version = "1.0.0"
description = "旅行保险AI理赔审核系统"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "requests",
    "python-dotenv",
    "urllib3<2",
    "aiohttp>=3.8.0",
    "python-docx>=0.8.11",
    "pdf2image>=1.16.0",
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=9.0.0",
    "aliyun-python-sdk-core>=2.13.0",
    "aliyun-python-sdk-ocr>=1.0.0",
    "tencentcloud-sdk-python>=3.0.0",
    "baidu-aip>=4.16.0",
    "aiomysql>=0.1.1",
    "pymysql>=1.0.0",
    "APScheduler>=3.9.0",
    "sentry-sdk>=1.14.0",
    "slack-sdk>=3.19.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*", "prompts*"]